<!doctype html>
<html lang="en">
  <head>

  <body>
    <main id="board" data-side="none" data-heads="0" data-tails="0">
      <h1 class="motto">Call it in the air.</h1>

      <div class="coin-stage">
        <svg id="coin" class="coin" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <circle class="coin-disc" cx="100" cy="100" r="97"></circle>
          <circle class="coin-rim" cx="100" cy="100" r="88"></circle>
          <circle class="coin-beads" cx="100" cy="100" r="80" pathLength="60"></circle>
          <g class="face face-crown">
            <path d="M60 128 L52 80 L78 104 L100 68 L122 104 L148 80 L140 128 Z"></path>
            <circle cx="52" cy="74" r="6"></circle>
            <circle cx="100" cy="60" r="6"></circle>
            <circle cx="148" cy="74" r="6"></circle>
            <rect x="60" y="134" width="80" height="9"></rect>
          </g>
          <g class="face face-scales">
            <path d="M100 66 V140"></path>
            <path d="M58 76 H142"></path>
            <path d="M76 142 H124"></path>
            <path d="M58 76 L44 116 M58 76 L72 116"></path>
            <path d="M142 76 L128 116 M142 76 L156 116"></path>
            <circle class="solid" cx="100" cy="62" r="6"></circle>
            <path class="solid" d="M40 116 Q58 138 76 116 Z"></path>
            <path class="solid" d="M124 116 Q142 138 160 116 Z"></path>
          </g>
        </svg>
      </div>

      <div class="ledger">
        <output id="result" aria-live="polite">No flip yet</output>

        <button id="flip" type="button">Flip the coin</button>

        <dl class="tally">
          <div class="tally-column">
            <dt>Heads</dt>
            <dd><span id="heads-count" class="count">0</span></dd>
          </div>
          <div class="tally-column">
            <dt>Tails</dt>
            <dd><span id="tails-count" class="count">0</span></dd>
          </div>
        </dl>
      </div>
    </main>
  </body>
</html>
